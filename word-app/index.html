<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단어카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="플래시카드와 간격 반복으로 영어 단어를 외우는 앱">
<meta name="theme-color" content="#2550C4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="단어카드">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 한 손 세로 화면 앱. 위에 오늘 할 일, 가운데 인덱스카드, 아래 탭바. */
:root {
  --bg: #E9EDF2;
  --surface: #FFFFFF;
  --card: #FDFCF8;
  --ink: #172033;
  --muted: #5B667A;
  --line: #D5DCE6;
  --rule: #D3E2F4;
  --margin: #E36B6B;
  --accent: #2550C4;
  --accent-soft: #DCE5FA;
  --accent-ink: #FFFFFF;
  --good: #1F8A5B;
  --good-soft: #DDF2E7;
  --warn: #B86E00;
  --warn-soft: #FBEBCF;
  --bad: #C8423B;
  --bad-soft: #F8DEDC;
  --stamp: #D9473F;
  --shadow: 0 1px 2px rgba(23,32,51,.06), 0 8px 24px rgba(23,32,51,.08);
  --f-display: "Bricolage Grotesque", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F141C; --surface: #171E29; --card: #1C2431; --ink: #E6EBF3; --muted: #97A3B6;
    --line: #2A3443; --rule: #26364C; --margin: #9A4646; --accent: #7C9BFF; --accent-soft: #23305A;
    --accent-ink: #0F141C; --good: #4CC38A; --good-soft: #17352A; --warn: #E0A93B; --warn-soft: #3A2E14;
    --bad: #F0776F; --bad-soft: #3D1F1E; --stamp: #F0776F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141C; --surface: #171E29; --card: #1C2431; --ink: #E6EBF3; --muted: #97A3B6;
  --line: #2A3443; --rule: #26364C; --margin: #9A4646; --accent: #7C9BFF; --accent-soft: #23305A;
  --accent-ink: #0F141C; --good: #4CC38A; --good-soft: #17352A; --warn: #E0A93B; --warn-soft: #3A2E14;
  --bad: #F0776F; --bad-soft: #3D1F1E; --stamp: #F0776F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--f-body);
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 24px);
}
.appbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px 14px; }
.brand { display: flex; align-items: center; gap: 10px; font: 800 20px/1 var(--f-display); letter-spacing: -.01em; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand-mark i { width: 18px; height: 13px; background: var(--card); border-radius: 2px; border-top: 3px solid var(--margin); display: block; }
.points-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.points-chip b { color: var(--accent); }

h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font: 700 17px/1.3 var(--f-body); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; margin: 0; }
.muted { color: var(--muted); }
.stack { display: grid; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; transition: transform .08s ease; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { width: 100%; min-height: 54px; font-size: 17px; border-radius: 14px; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn[disabled] { opacity: .5; cursor: default; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }

/* 오늘 */
.today { display: grid; gap: 14px; }
.today-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.deck-switch { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 0; font-size: 14px; }
.goal { display: grid; gap: 8px; }
.goal-num { font: 800 44px/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.goal-num small { font-size: 18px; color: var(--muted); font-weight: 600; margin-left: 4px; }
.bar { height: 10px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .4s ease; }
.today-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.today-meta b { color: var(--ink); font-variant-numeric: tabular-nums; }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); }
.banner svg { flex: none; width: 22px; height: 22px; color: var(--warn); margin-top: 1px; }
.banner p { margin: 0; font-size: 14px; }
.banner b { display: block; }

/* 출석 */
.attend { display: grid; gap: 12px; }
.attend-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.level { display: flex; align-items: center; gap: 10px; }
.level-badge { font: 800 15px/1 var(--f-display); background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 10px; }
.level-text { font-size: 13px; color: var(--muted); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { display: grid; justify-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.stamp { width: 38px; height: 38px; max-width: 100%; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: transparent; }
.stamp.on { border: 2px solid var(--stamp); color: var(--stamp); transform: rotate(-12deg); background: color-mix(in srgb, var(--stamp) 8%, transparent); }
.stamp.today { border-color: var(--accent); border-style: solid; }
.day.is-today { color: var(--accent); font-weight: 700; }
.attend-btn.done { background: var(--good-soft); color: var(--good); border-color: var(--good); }
.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.rules li { display: flex; justify-content: space-between; gap: 12px; }
.rules b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* 단어장 선택 */
.decks { display: grid; gap: 10px; }
.deck { text-align: left; display: grid; gap: 8px; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); }
.deck.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.deck-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.deck-name { font-weight: 700; font-size: 16px; }
.deck-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.deck-desc { font-size: 13px; color: var(--muted); margin: 0; }
.deck .bar { height: 6px; }
.sel-tag { font-size: 12px; font-weight: 700; color: var(--accent); }

/* 탭바 */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar nav { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
.tab { border: 0; background: none; display: grid; place-items: center; align-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }

/* 학습 화면 */
.study {
  position: fixed; inset: 0; z-index: 40; background: var(--bg);
  display: grid; grid-template-rows: auto 1fr auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.study-in { max-width: 560px; width: 100%; margin: 0 auto; }
.study-top { display: flex; align-items: center; gap: 12px; }
.study-top .bar { flex: 1; }
.study-count { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
.stage { display: grid; place-items: center; padding-block: 16px; min-height: 0; }
.flip { width: 100%; max-width: 520px; aspect-ratio: 5 / 3.4; max-height: 100%; perspective: 1400px; border: 0; padding: 0; background: none; }
.flip-in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3,.7,.2,1); }
.flip.on .flip-in { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 14px; background-color: var(--card); box-shadow: var(--shadow);
  background-image:
    linear-gradient(var(--margin), var(--margin)),
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  background-size: 100% 2px, 100% calc(100% - 64px);
  background-position: 0 56px, 0 64px;
  background-repeat: no-repeat;
  display: grid; grid-template-rows: 56px 1fr; text-align: center; overflow: hidden;
}
.face.back { transform: rotateY(180deg); }
.face-head { display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.face-body { display: grid; place-items: center; align-content: center; gap: 10px; padding: 8px 20px 16px; min-height: 0; }
.word { font: 700 clamp(30px, 9vw, 46px)/1.1 var(--f-display); letter-spacing: -.015em; overflow-wrap: anywhere; }
.word.ko { font-family: var(--f-body); font-size: clamp(24px, 7vw, 34px); }
.meaning { font-size: clamp(20px, 5.6vw, 26px); font-weight: 700; }
.example { font-size: 15px; color: var(--muted); max-width: 40ch; }
.example em { font-style: normal; color: var(--ink); font-weight: 600; background: linear-gradient(transparent 60%, var(--accent-soft) 60%); }
.tap-hint { font-size: 13px; color: var(--muted); }
.speak { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--accent); }
.speak svg { width: 16px; height: 16px; }
.actions { display: grid; gap: 10px; }
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grade { min-height: 62px; border-radius: 14px; border: 1.5px solid; display: grid; place-items: center; align-content: center; gap: 2px; font-weight: 700; font-size: 16px; }
.grade small { font-size: 12px; font-weight: 600; opacity: .85; }
.g0 { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.g1 { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.g2 { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.done { text-align: center; display: grid; gap: 14px; justify-items: center; max-width: 380px; }
.done-score { font: 800 56px/1 var(--f-display); color: var(--accent); }
.done-list { display: flex; gap: 18px; font-size: 14px; color: var(--muted); }
.done-list b { color: var(--ink); }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); text-align: center; }

/* 퀴즈 */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; border-radius: 9px; min-height: 40px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.q-prompt { text-align: center; display: grid; gap: 8px; justify-items: center; padding-block: 10px 4px; }
.choices { display: grid; gap: 10px; }
.choice { text-align: left; min-height: 54px; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; }
.choice.right { border-color: var(--good); background: var(--good-soft); color: var(--good); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.input { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.input:focus { border-color: var(--accent); outline: none; }
.spell-input { font: 600 22px/1.2 var(--f-display); text-align: center; letter-spacing: .02em; }
.feedback { text-align: center; font-weight: 700; min-height: 24px; }
.feedback.ok { color: var(--good); }
.feedback.no { color: var(--bad); }
.result-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.result-list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--bad-soft); font-size: 14px; }

/* 단어장 */
.search { display: flex; gap: 8px; }
.filter { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.wlist { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.wlist li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
.wlist li:first-child { border-top: 0; }
.w-main { flex: 1; min-width: 0; }
.w-en { font: 700 16px/1.25 var(--f-display); }
.w-ko { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { flex: none; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.pill.new { background: var(--accent-soft); color: var(--accent); }
.pill.learning { background: var(--warn-soft); color: var(--warn); }
.pill.known { background: var(--good-soft); color: var(--good); }
.mini { width: 36px; height: 36px; border-radius: 10px; border: 0; background: none; display: grid; place-items: center; color: var(--muted); flex: none; }
.mini svg { width: 18px; height: 18px; }
details.panel summary { font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.panel summary::-webkit-details-marker { display: none; }
details.panel summary::after { content: "+"; font-size: 20px; color: var(--muted); }
details.panel[open] summary::after { content: "−"; }
details.panel[open] summary { margin-bottom: 12px; }
textarea.input { min-height: 120px; resize: vertical; font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.empty { text-align: center; padding: 24px 12px; color: var(--muted); }

/* 설정 */
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 10px; border-top: 1px solid var(--line); }
.set-row:first-of-type { border-top: 0; }
.set-row > div { min-width: 0; }
.set-row p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
select.input { min-height: 40px; padding: 6px 10px; width: auto; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.install-steps { margin: 0; padding-left: 20px; font-size: 14px; display: grid; gap: 4px; }

/* 처음 실행 */
.onboard { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 32px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.onboard-in { max-width: 520px; margin: 0 auto; display: grid; gap: 18px; }
.onboard h1 { font: 800 30px/1.15 var(--f-display); letter-spacing: -.02em; }

@media (prefers-reduced-motion: reduce) {
  .flip-in, .bar i, .btn, .switch span, .switch span::after { transition: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="appbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i></span>단어카드</div>
    <span class="points-chip" id="pointsChip" title="내 점수"><span>점수</span><b id="pointsVal">0</b></span>
  </header>

  <main>
    <!-- 홈 -->
    <section id="view-home" class="stack" aria-label="홈"></section>
    <!-- 퀴즈 -->
    <section id="view-quiz" class="stack" aria-label="퀴즈" hidden></section>
    <!-- 단어장 -->
    <section id="view-words" class="stack" aria-label="단어장" hidden></section>
    <!-- 설정 -->
    <section id="view-settings" class="stack" aria-label="설정" hidden></section>
  </main>
</div>

<div class="tabbar">
  <nav aria-label="메뉴">
    <button class="tab" data-view="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button class="tab" data-view="quiz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17.5h.01"/></svg>퀴즈</button>
    <button class="tab" data-view="words">
