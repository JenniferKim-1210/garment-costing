<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단어카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="하루 20개씩 카드로 외우는 영어 단어 앱">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="단어카드">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 흑백 바탕에 큰 글씨, 포인트 색은 파랑 하나. 박스 대신 여백과 얇은 띠로 구역을 나눈다. */
:root {
  --paper: #FFFFFF;
  --ink: #111113;
  --sub: #6E6E73;
  --faint: #B4B4BA;
  --band: #F5F5F7;
  --hair: #E8E8EC;
  --accent: #2F6BFF;
  --accent-soft: #EAF0FF;
  --ok: #12A566;
  --tri: #E08A00;
  --red: #E5484D;
  --btn: #111113;
  --btn-ink: #FFFFFF;
  /* 카드: 앞면은 진하게, 뒷면은 밝게 */
  --card-a: #111113; --card-a-ink: #FFFFFF; --card-a-sub: #8E8E93;
  --card-b: #F2F2F5; --card-b-ink: #111113; --card-b-sub: #6E6E73;
  --f: "Inter", "Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --gl: max(20px, env(safe-area-inset-left, 0px));
  --gr: max(20px, env(safe-area-inset-right, 0px));
  --nav-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E0E10; --ink: #F5F5F7; --sub: #9A9AA0; --faint: #5A5A60; --band: #1A1A1D; --hair: #2A2A2E;
    --accent: #5B8CFF; --accent-soft: #16223F; --ok: #3CCB7F; --tri: #F0A93B; --red: #FF6369;
    --btn: #F5F5F7; --btn-ink: #111113;
    --card-a: #F5F5F7; --card-a-ink: #111113; --card-a-sub: #6E6E73;
    --card-b: #1E1E22; --card-b-ink: #F5F5F7; --card-b-sub: #9A9AA0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E0E10; --ink: #F5F5F7; --sub: #9A9AA0; --faint: #5A5A60; --band: #1A1A1D; --hair: #2A2A2E;
  --accent: #5B8CFF; --accent-soft: #16223F; --ok: #3CCB7F; --tri: #F0A93B; --red: #FF6369;
  --btn: #F5F5F7; --btn-ink: #111113;
  --card-a: #F5F5F7; --card-a-ink: #111113; --card-a-sub: #6E6E73;
  --card-b: #1E1E22; --card-b-ink: #F5F5F7; --card-b-sub: #9A9AA0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 500 15px/1.55 var(--f); -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
[hidden] { display: none !important; }
h1, h2, p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.wrap {
  max-width: 520px; margin: 0 auto;
  padding-left: var(--gl); padding-right: var(--gr);
  padding-block: calc(env(safe-area-inset-top, 0px) + 6px) calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 32px);
}
.top { display: flex; justify-content: space-between; align-items: center; height: 48px; }
.logo { font-weight: 800; font-size: 17px; letter-spacing: -.03em; }
.lv { font-size: 13px; font-weight: 600; color: var(--sub); font-variant-numeric: tabular-nums; }
.band { height: 8px; background: var(--band); margin-left: calc(-1 * var(--gl)); margin-right: calc(-1 * var(--gr)); }

/* 버튼 */
.cta { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; border-radius: 16px; background: var(--btn); color: var(--btn-ink); font-weight: 700; font-size: 16px; letter-spacing: -.01em; transition: transform .1s ease; }
.line { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; border-radius: 16px; background: var(--band); font-weight: 600; font-size: 15px; transition: transform .1s ease; }
.cta:active, .line:active { transform: scale(.985); }
.cta[disabled] { opacity: .35; cursor: default; }
.line b { color: var(--accent); font-weight: 700; }
.line.done { color: var(--sub); cursor: default; }
.text-btn { font-weight: 600; font-size: 14px; color: var(--sub); min-height: 44px; }

/* 홈: 오늘 */
.hero { display: grid; gap: 20px; padding-block: 12px 32px; }
.deckpick { display: inline-flex; align-items: center; gap: 6px; justify-self: start; font-weight: 600; font-size: 13px; height: 34px; padding: 0 10px 0 14px; border-radius: 999px; background: var(--band); }
.deckpick svg { width: 14px; height: 14px; color: var(--sub); }
.headline { font-weight: 800; font-size: clamp(30px, 8.8vw, 40px); line-height: 1.24; letter-spacing: -.04em; }
.headline mark { background: none; color: var(--accent); }
.tally { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.tally i { height: 6px; border-radius: 3px; background: var(--hair); }
.tally i.on { background: var(--accent); }
.sub { color: var(--sub); font-size: 14px; }
.memo { background: var(--band); border-radius: 16px; padding: 14px 16px; font-size: 14px; color: var(--sub); }
.memo b { display: block; color: var(--ink); font-weight: 700; font-size: 15px; }

/* 구역 */
.sec { display: grid; gap: 18px; padding-block: 28px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sec-head h2 { font-size: 18px; font-weight: 700; letter-spacing: -.03em; }
.sec-head span { font-size: 13px; color: var(--sub); font-weight: 500; }

/* 출석 */
.week { display: grid; grid-template-columns: repeat(7, 1fr); }
.day { display: grid; justify-items: center; gap: 6px; font-size: 12px; color: var(--sub); font-weight: 500; }
.day.is-today { color: var(--ink); font-weight: 700; }
.slot { width: 38px; height: 38px; max-width: 100%; border-radius: 50%; display: grid; place-items: center; background: var(--band); color: var(--faint); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.slot.on { background: var(--accent); color: var(--btn-ink); }
.day.is-today .slot:not(.on) { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
.chk { width: 18px; height: 18px; display: block; color: #FFFFFF; }
.chk.pop { animation: pop .3s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.lvrow { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--sub); }
.lvrow b { color: var(--ink); font-weight: 700; font-size: 14px; }
.lvbar { flex: 1; height: 4px; border-radius: 2px; background: var(--hair); overflow: hidden; }
.lvbar i { display: block; height: 100%; background: var(--ink); border-radius: 2px; }
.how summary { font-size: 13px; font-weight: 600; color: var(--sub); cursor: pointer; list-style: none; }
.how summary::-webkit-details-marker { display: none; }
.how summary::after { content: " ›"; }
.how[open] summary::after { content: ""; }
.how ul { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; font-size: 14px; color: var(--sub); }
.how li { display: flex; justify-content: space-between; gap: 12px; }
.how li b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

.trio { display: grid; grid-template-columns: repeat(3, 1fr); }
.trio div { font-size: 13px; color: var(--sub); display: grid; gap: 2px; }
.trio b { font-weight: 800; font-size: 28px; line-height: 1.15; color: var(--ink); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }

/* 탭바 */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--hair);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar nav { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
.tab { display: grid; place-items: center; align-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--faint); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }

/* 단어장 고르기 */
.sheet { position: fixed; inset: 0; z-index: 50; background: var(--paper); overflow-y: auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 48px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-left: var(--gl); padding-right: var(--gr); }
.sheet-in { max-width: 520px; margin: 0 auto; display: grid; gap: 14px; }
.rows { margin-top: 14px; display: grid; gap: 10px; }
.deckrow { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; padding: 18px 20px; border-radius: 20px; background: var(--band); transition: transform .1s ease; }
.deckrow:active { transform: scale(.985); }
.deckrow.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.deckrow[disabled] { opacity: .5; cursor: default; }
.deckrow-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.deckrow-main b { font-size: 17px; font-weight: 700; letter-spacing: -.03em; }
.deckrow-main span { font-size: 13px; color: var(--sub); }
.deckrow-cnt { flex: none; font-size: 13px; font-weight: 600; color: var(--sub); font-variant-numeric: tabular-nums; text-align: right; }
.deckrow-cnt em { display: block; font-style: normal; color: var(--accent); font-weight: 700; }

/* 학습 */
.study { position: fixed; inset: 0; z-index: 40; background: var(--paper); display: grid; grid-template-rows: auto 1fr auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: var(--gl); padding-right: var(--gr); }
.st-in { max-width: 520px; width: 100%; margin: 0 auto; }
.st-top { display: flex; align-items: center; gap: 14px; height: 44px; }
.x { width: 44px; height: 44px; margin-left: -11px; display: grid; place-items: center; flex: none; }
.x svg { width: 22px; height: 22px; }
.st-line { flex: 1; height: 4px; border-radius: 2px; background: var(--hair); overflow: hidden; }
.st-line i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s ease; }
.st-n { font-weight: 600; font-size: 13px; color: var(--sub); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }
.stage { display: grid; place-items: center; min-height: 0; padding-block: 20px 34px; }

.fcard { position: relative; width: min(100%, 330px); aspect-ratio: 4 / 5; max-height: 100%; perspective: 1400px; cursor: pointer; }
.under { position: absolute; inset: 0; border-radius: 28px; transform-origin: 50% 100%; }
.u1 { transform: translateY(12px) scale(.92); background: color-mix(in srgb, var(--card-a) 28%, var(--paper)); }
.u2 { transform: translateY(24px) scale(.84); background: color-mix(in srgb, var(--card-a) 13%, var(--paper)); }
.flip-in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.7,.2,1); }
.fcard.on .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 28px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 48px 24px 30px; text-align: center; overflow: hidden; }
.front { background: var(--card-a); color: var(--card-a-ink); --c-sub: var(--card-a-sub); --c-ink: var(--card-a-ink); }
.back { background: var(--card-b); color: var(--card-b-ink); --c-sub: var(--card-b-sub); --c-ink: var(--card-b-ink); transform: rotateY(180deg); }
.tag { position: absolute; top: 22px; left: 24px; font-size: 12px; font-weight: 600; color: var(--c-sub); }
.w { font-weight: 800; font-size: clamp(32px, 10vw, 44px); line-height: 1.1; letter-spacing: -.04em; overflow-wrap: anywhere; }
.w.long { font-size: clamp(25px, 7.6vw, 32px); }
.w.ko { font-size: clamp(24px, 7.2vw, 31px); line-height: 1.3; letter-spacing: -.03em; font-weight: 700; }
.w.sm { font-size: 17px; font-weight: 600; letter-spacing: -.02em; color: var(--c-sub); }
.mean { font-weight: 800; font-size: clamp(26px, 7.8vw, 34px); line-height: 1.25; letter-spacing: -.04em; }
.ex { font-size: 15px; line-height: 1.55; color: var(--c-sub); max-width: 30ch; }
.ex mark { background: none; color: var(--c-ink); font-weight: 600; }
.say { width: 44px; height: 44px; border-radius: 50%; background: color-mix(in srgb, var(--c-ink) 14%, transparent); color: var(--c-ink); display: grid; place-items: center; flex: none; }
.say svg { width: 19px; height: 19px; }
.say.on-paper { background: var(--band); color: var(--ink); }
.hint { font-size: 13px; font-weight: 500; color: var(--c-sub); }

.oxs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ox { display: grid; justify-items: center; gap: 2px; padding: 13px 4px 12px; border-radius: 18px; background: var(--band); transition: transform .1s ease; }
.ox:active { transform: scale(.97); }
.ox svg { width: 26px; height: 26px; margin-bottom: 2px; }
.ox b { font-weight: 700; font-size: 15px; }
.ox small { font-size: 12px; color: var(--sub); font-weight: 500; }
.ox-x svg { color: var(--red); } .ox-t svg { color: var(--tri); } .ox-o svg { color: var(--ok); }
.st-actions { display: grid; gap: 10px; }

.fin { display: grid; justify-items: center; gap: 16px; text-align: center; }
.bigchk { width: 88px; height: 88px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; animation: pop .4s cubic-bezier(.2,1.5,.4,1) both; margin-bottom: 8px; }
.bigchk svg { width: 40px; height: 40px; color: #FFFFFF; }
.fin .headline { font-size: clamp(27px, 8vw, 34px); }
.fin-nums { display: flex; gap: 18px; font-size: 14px; color: var(--sub); }
.fin-nums b { color: var(--ink); font-weight: 700; }

.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 10px); transform: translateX(-50%); background: var(--btn); color: var(--btn-ink); padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); width: max-content; text-align: center; }

/* 퀴즈 */
.page { display: grid; gap: 20px; padding-block: 14px 8px; }
.page .headline { font-size: clamp(27px, 8vw, 34px); }
.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--hair); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; padding: 10px 0 11px; font-weight: 600; font-size: 15px; color: var(--faint); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); font-weight: 700; }
.tabs button small { font-weight: 600; font-size: 12px; margin-left: 4px; opacity: .7; }
.q { display: grid; justify-items: start; gap: 12px; padding-block: 16px 4px; }
.q .w, .q .mean { text-align: left; }
.q .ex { color: var(--sub); max-width: none; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; min-height: 58px; padding: 12px 18px; border-radius: 16px; background: var(--band); font-weight: 600; font-size: 16px; }
.opt .no { flex: none; width: 22px; font-size: 14px; font-weight: 700; color: var(--faint); font-variant-numeric: tabular-nums; }
.opt.right { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); }
.opt.right .no { color: var(--accent); }
.opt.wrong { color: var(--faint); box-shadow: inset 0 0 0 1.5px var(--red); }
.fb { min-height: 24px; font-weight: 700; font-size: 15px; }
.fb.ok { color: var(--ok); } .fb.no { color: var(--red); }
.under-input { width: 100%; min-height: 54px; border: 0; background: var(--band); border-radius: 16px; padding: 10px 18px; font-size: 16px; font-weight: 500; }
.under-input::placeholder { color: var(--faint); }
.under-input:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--ink); }
.under-input.spell { font-weight: 700; font-size: 22px; letter-spacing: -.02em; min-height: 60px; }
.score { font-weight: 800; font-size: 64px; line-height: 1; letter-spacing: -.05em; }
.score small { font-size: 22px; color: var(--sub); font-weight: 600; letter-spacing: -.02em; }
.wrongs { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--hair); }
.wrongs li { display: flex; justify-content: space-between; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--hair); }
.wrongs b { font-weight: 700; font-size: 16px; letter-spacing: -.02em; }
.wrongs span { color: var(--sub); text-align: right; }

/* 단어장 */
.wlist { list-style: none; margin: 0; padding: 0; }
.wlist li { display: flex; align-items: center; gap: 8px; padding: 13px 0; border-bottom: 1px solid var(--hair); }
.w-main { flex: 1; min-width: 0; }
.w-en { font-weight: 700; font-size: 16px; line-height: 1.3; letter-spacing: -.02em; }
.w-ko { font-size: 13px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st { flex: none; font-size: 12px; font-weight: 600; color: var(--faint); }
.st.learning { color: var(--sub); } .st.known { color: var(--accent); }
.ic { width: 40px; height: 40px; display: grid; place-items: center; color: var(--faint); flex: none; }
.ic svg { width: 19px; height: 19px; }
.fold { border-bottom: 1px solid var(--hair); }
.fold summary { display: flex; justify-content: space-between; align-items: center; min-height: 54px; font-weight: 600; cursor: pointer; list-style: none; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary::after { content: "+"; font-weight: 400; font-size: 22px; line-height: 1; color: var(--sub); }
.fold[open] summary::after { content: "–"; }
.fold-body { display: grid; gap: 14px; padding-bottom: 22px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--sub); }
textarea.box { width: 100%; min-height: 120px; border: 0; border-radius: 16px; background: var(--band); padding: 14px 18px; font-size: 14px; resize: vertical; }
textarea.box:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.note { font-size: 13px; color: var(--sub); line-height: 1.6; }
.empty { padding: 36px 0; color: var(--sub); border-bottom: 0 !important; }
.search { margin-bottom: 6px; }

/* 설정 */
.grp { padding-block: 22px 10px; }
.grp h2 { font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 4px; }
.set { display: flex; justify-content: space-between; align-items: center; gap: 14px; min-height: 58px; padding-block: 10px; }
.set > div { min-width: 0; }
.set b { font-weight: 600; font-size: 16px; display: block; letter-spacing: -.02em; }
.set p { font-size: 13px; color: var(--sub); }
.sel { border: 0; background: transparent; font-weight: 600; font-size: 15px; text-align: right; padding: 8px 0 8px 8px; max-width: 46%; color: var(--sub); }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--hair); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 3px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
.stack { display: grid; gap: 12px; }

@media (prefers-reduced-motion: reduce) {
  .flip-in, .st-line i, .switch span, .switch span::after, .cta, .line, .ox, .deckrow { transition: none; }
