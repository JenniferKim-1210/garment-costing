name: 단어카드 안드로이드 빌드

on:
  push:
    paths:
      - 'word-app/**'
      - '.github/workflows/wordcard-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: word-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: word-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 패키지 설치
        run: npm ci

      - name: 안드로이드 프로젝트 만들기
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npm run build
          npx cap add android
          npx capacitor-assets generate --android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: 테스트용 APK 빌드
        working-directory: word-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 테스트용 APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: wordcard-test-apk
          path: word-app/android/app/build/outputs/apk/debug/app-debug.apk

      # 플레이스토어 업로드용 AAB: 저장소 Secrets 에 서명 키 4개를 넣었을 때만 만듭니다
      - name: 플레이스토어용 AAB 빌드
        if: env.HAS_KEYSTORE == 'true'
        working-directory: word-app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: 플레이스토어용 AAB 올리기
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wordcard-playstore-aab
          path: word-app/android/app/build/outputs/bundle/release/app-release.aab
